name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Синтаксис
        run: node --check who-watching.js
      - name: Тесты
        run: node test/plugin.test.js
