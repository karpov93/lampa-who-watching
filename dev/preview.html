<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Кто смотрит? — стенд вёрстки</title>
    <!-- Локальная копия Lampa (в репозиторий не входит, см. .gitignore) -->
    <link rel="stylesheet" href="lampa/css/app.css">
    <style>
        html, body { margin: 0; height: 100%; }
        body { background: #1d1f20; }

        .stand-controls {
            position: fixed; left: 2em; top: 2em; z-index: 100;
            font: 400 14px/1.4 "SegoeUI", Arial, sans-serif; color: #fff;
            background: rgba(0, 0, 0, .55); border-radius: 1em; padding: 1em 1.2em;
        }
        .stand-controls b { font-weight: 600; }
        .stand-controls button {
            margin: .2em .3em .2em 0; padding: .35em .8em; cursor: pointer;
            background: #2a2d2e; color: #fff; border: 1px solid #4a4d4e; border-radius: .6em;
        }
        .stand-controls button.on { background: #fff; color: #000; }
        .stand-hint { opacity: .6; margin-top: .6em; max-width: 22em; }
        .stand-status { margin-top: .6em; font: 12px/1.4 Consolas, monospace; opacity: .75; max-width: 24em; }
    </style>
</head>
<body class="selectbox--open">

<div class="stand-controls">
    <div><b>Кто смотрит? — стенд</b></div>
    <div>
        Профилей:
        <button data-n="2">2</button>
        <button data-n="3">3</button>
        <button data-n="6">6</button>
        <button data-n="8">8</button>
    </div>
    <div>
        Тема:
        <button data-theme="dark" class="on">тёмная</button>
        <button data-theme="light">светлая</button>
    </div>
    <div class="stand-hint">Стрелки ← → — фокус, как в Lampa. Панель и стили — родные; от плагина только раскладка ряда.</div>
    <div class="stand-status" id="stand-status">загрузка…</div>
</div>

<!-- Разметка повторяет родной selectbox Lampa 3.4.8 -->
<div class="selectbox selectbox--fullsize who-watching" id="panel">
    <div class="selectbox__layer"></div>
    <div class="selectbox__content layer--height">
        <div class="selectbox__head">
            <div class="selectbox__title">Профили</div>
        </div>
        <div class="selectbox__body">
            <div class="scroll scroll--mask scroll--over scroll--horizontal" id="scroll">
                <div class="scroll__content">
                    <div class="scroll__body" id="scroll-body"></div>
                </div>
            </div>
        </div>
        <div class="selectbox__text selector">
            <div>Профили нужны, чтобы у каждого была своя история, закладки и настройки</div>
        </div>
    </div>
</div>

<script>
    /* Минимальная заглушка Lampa: плагину нужно только вставить свои стили
       и обернуть Select.show — этого достаточно для стенда. */
    var noop = function () {};
    var stubLampa = {
        Manifest: { app_digital: 348, app_version: '3.4.8-preview' },
        Listener: { follow: noop, send: noop },
        Select: { show: noop, listener: { follow: noop } },
        Account: {
            Permit: {},
            Api: { load: function () { var p = { then: function () { return p; }, 'catch': function () { return p; } }; return p; } },
            listener: { follow: noop },
            Profile: { select: noop }
        },
        Controller: { back: noop },
        Activity: { refresh: noop }
    };
    window.Lampa = stubLampa;
    window.appready = true;
</script>
<script>
    window.addEventListener('error', function (e) {
        var el = document.getElementById('stand-status');
        if (el) el.textContent = 'Ошибка: ' + (e.message || e.type) + (e.filename ? ' (' + e.filename.split('/').pop() + ')' : '');
    });
</script>
<script src="../who-watching.js"></script>
<script>
    (function () {
        'use strict';

        var names = ['Андрей', 'Ольга', 'Миша', 'Аня', 'Даша', 'Серёжа', 'Катя', 'Папа'];
        /* Настоящие иконки профилей CUB — те же, что Lampa показывает в меню
           профилей. Если ноутбук без интернета — подставится родная заглушка
           Lampa (dev/lampa/img/img_load.svg), вёрстка от этого не страдает. */
        var icons = ['l_1', 'f_1', 'l_2', 'f_2', 'l_3', 'f_3', 'l_4', 'f_4'];
        var iconFails = 0;
        var body = document.getElementById('scroll-body');
        var panel = document.getElementById('panel');
        var scroll = document.getElementById('scroll');
        var current = 0;
        var count = 3;

        /* Lampa берёт иконки с cub_domain, а он зависит от региона:
           cub.best / cub.black / cub.red. Пробуем по очереди, в конце —
           родная заглушка Lampa. */
        var iconHosts = ['cub.best', 'cub.black', 'cub.red'];

        window.WW_ICON_FAIL = function (img) {
            var src = img.getAttribute('src') || '';
            var host = null;
            var i;
            for (i = 0; i < iconHosts.length; i++) {
                if (src.indexOf(iconHosts[i]) >= 0) { host = i; break; }
            }
            if (host !== null && host + 1 < iconHosts.length) {
                img.setAttribute('src', src.replace(iconHosts[host], iconHosts[host + 1]));
                return;
            }
            iconFails++;
            img.onerror = null;
            img.setAttribute('src', 'lampa/img/img_load.svg');
            setTimeout(updateStatus, 0);
        };

        function icon(index) {
            return 'https://cub.best/img/profiles/' + icons[index % icons.length] + '.png';
        }

        function item(index, name, subtitle) {
            var el = document.createElement('div');
            el.className = 'selectbox-item selectbox-item--icon selector';
            el.innerHTML =
                '<div class="selectbox-item__icon"><img src="' + icon(index) +
                '" onerror="WW_ICON_FAIL(this)"></div>' +
                '<div><div class="selectbox-item__title">' + name + '</div>' +
                '<div class="selectbox-item__subtitle">' + (subtitle || '') + '</div></div>';
            return el;
        }

        function addItem() {
            var el = document.createElement('div');
            el.className = 'selectbox-item selectbox-item--icon selector';
            el.innerHTML =
                '<div class="selectbox-item__icon"><svg viewBox="0 0 96 96" width="96" height="96" ' +
                'fill="none" stroke="currentColor" stroke-width="3"><circle cx="48" cy="48" r="42"/>' +
                '<path d="M48 30v36M30 48h36"/></svg></div>' +
                '<div><div class="selectbox-item__title">Добавить профиль</div>' +
                '<div class="selectbox-item__subtitle"></div></div>';
            return el;
        }

        function render() {
            body.innerHTML = '';
            var i;
            for (i = 0; i < count; i++) {
                var subtitle = i === 0 ? 'основной' : (i === 2 ? 'детский (до 12)' : '');
                body.appendChild(item(i, names[i % names.length], subtitle));
            }
            body.appendChild(addItem());
            current = 0;
            focusItem(0, true);
        }

        function items() {
            return Array.prototype.slice.call(body.querySelectorAll('.selectbox-item'));
        }

        function focusItem(index, immediate) {
            var list = items();
            if (!list.length) return;
            index = Math.max(0, Math.min(list.length - 1, index));
            list.forEach(function (el) { el.classList.remove('focus'); });
            current = index;
            list[index].classList.add('focus');
            follow(list[index], immediate);
            updateMask();
        }

        function follow(el, immediate) {
            var br = body.getBoundingClientRect();
            var ir = el.getBoundingClientRect();
            var pad = 24;
            var left = ir.left - br.left + body.scrollLeft;
            var right = left + ir.width;
            if (left - pad < body.scrollLeft) body.scrollLeft = Math.max(0, left - pad);
            else if (right + pad > body.scrollLeft + body.clientWidth) {
                body.scrollLeft = right + pad - body.clientWidth;
            }
        }

        function updateMask() {
            var overflow = body.scrollWidth > body.clientWidth + 4;
            panel.classList.toggle('who-watching--overflow', overflow);
            scroll.classList.toggle('scroll--mask', overflow);
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowRight') { focusItem(current + 1); e.preventDefault(); }
            if (e.key === 'ArrowLeft') { focusItem(current - 1); e.preventDefault(); }
        });

        var buttons = document.querySelectorAll('.stand-controls button[data-n]');
        Array.prototype.forEach.call(buttons, function (btn) {
            btn.addEventListener('click', function () {
                count = parseInt(btn.getAttribute('data-n'), 10);
                Array.prototype.forEach.call(buttons, function (b) { b.classList.remove('on'); });
                btn.classList.add('on');
                render();
            });
        });

        var themeButtons = document.querySelectorAll('.stand-controls button[data-theme]');
        Array.prototype.forEach.call(themeButtons, function (btn) {
            btn.addEventListener('click', function () {
                var light = btn.getAttribute('data-theme') === 'light';
                document.body.classList.toggle('light--version', light);
                Array.prototype.forEach.call(themeButtons, function (b) { b.classList.remove('on'); });
                btn.classList.add('on');
            });
        });

        var params = new URLSearchParams(location.search);
        if (params.get('n')) count = parseInt(params.get('n'), 10) || 3;
        if (params.get('light')) document.body.classList.add('light--version');
        Array.prototype.forEach.call(buttons, function (b) {
            b.classList.toggle('on', parseInt(b.getAttribute('data-n'), 10) === count);
        });

        render();
        window.addEventListener('resize', updateMask);

        function updateStatus() {
            var status = document.getElementById('stand-status');
            if (!status) return;
            var rect = panel.getBoundingClientRect();
            status.textContent = 'плиток: ' + items().length +
                ', панель: ' + Math.round(rect.width) + 'x' + Math.round(rect.height) +
                ', ряд: ' + Math.round(body.scrollWidth) + 'px в ' + Math.round(body.clientWidth) + 'px' +
                ', иконок с заглушкой: ' + iconFails;
        }

        updateStatus();
        setTimeout(updateStatus, 1200);
    })();
</script>
</body>
</html>
